name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m compileall -q catalyst examples

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - run: node --check catalyst/static/site.js && node --check catalyst/static/workshop.js && node --check catalyst/static/agents.js && node --check catalyst/static/activity.js
      - run: node --check catalyst/static/governance.js
