[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-commons"
version = "0.3.0"
description = "A human-directed commons for living ideas"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.128.2", "pydantic==2.13.4", "uvicorn==0.48.0",
  "jinja2==3.1.6", "python-multipart==0.0.29",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1"]

[project.scripts]
catalyst = "catalyst.cli:main"

[tool.setuptools.packages.find]
include = ["catalyst*"]

[tool.setuptools.package-data]
catalyst = ["schema.sql", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
